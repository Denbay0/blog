{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Signal Blog{% endblock %}</title><link rel="stylesheet" href="{% static 'style.css' %}"></head><body><header><a class="brand" href="{% url 'posts:index' %}">SIGNAL<span>/BLOG</span></a><nav>{% if user.is_authenticated %}<a href="{% url 'posts:create' %}">Написать</a><span>{{ user.username }}</span><form method="post" action="{% url 'users:logout' %}">{% csrf_token %}<button>Выйти</button></form>{% else %}<a href="{% url 'users:login' %}">Войти</a><a href="{% url 'users:register' %}">Регистрация</a>{% endif %}</nav></header><main>{% block content %}{% endblock %}</main><footer>Independent notes · Django practice</footer></body></html>
