{% extends 'posts/base.html' %}{% block title %}{{ post.title }}{% endblock %}{% block content %}<article class="detail"><div class="meta">{{ post.created_at|date:'d.m.Y H:i' }} · {{ post.author.username }}</div><h1>{{ post.title }}</h1><div class="body">{{ post.body|linebreaks }}</div>{% if user == post.author %}<a class="button" href="{% url 'posts:edit' post.pk %}">Редактировать</a>{% endif %}</article>{% endblock %}
