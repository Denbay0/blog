{% extends 'blogs/base.html' %}{% block title %}{{ post.title }}{% endblock %}{% block content %}<article class="detail"><div class="meta">{{ post.date_added|date:'d.m.Y H:i' }} · {{ post.owner.username }}</div><h1>{{ post.title }}</h1><div class="body">{{ post.text|linebreaks }}</div>{% if user == post.owner %}<a class="button" href="{% url 'blogs:edit' post.pk %}">Редактировать</a>{% endif %}</article>{% endblock %}
